baseURL = "/"
languageCode = "en"
title = "Privateer Docs"
enableRobotsTXT = true
disableKinds = ["RSS"]

[build]
  noJSConfigInAssets = true

[params]
  repoURL = "https://github.com/privateerproj"
  meridianURL = "https://meridian.revanite.io/"
  # TODO: replace with the real Privateer Slack invite link
  slackURL = "https://openssf.slack.com/archives/C0C78K9DB1A"
  linkedinURL = "https://www.linkedin.com/company/privateerproj/"
  brandLogo = "logo/patches-head.png"
  mascot = "logo/privateer-mascot.png"

  [[params.partners]]
    name = "LFX Insights"
    logo = "partners/lfx.svg"
    href = "https://insights.linuxfoundation.org/"
    height = "22px"

  [[params.partners]]
    name = "FINOS CCC"
    logo = "partners/finos-horizontal.svg"
    href = "https://ccc.finos.org/"
    height = "36px"

  [[params.partners]]
    name = "OpenSSF"
    logo = "partners/openssf.svg"
    href = "https://openssf.org/"
    height = "35px"
    
  [[params.partners]]
    name = "Meridian"
    logo = "partners/meridian.png"
    href = "https://meridian.revanite.io/"
    height = "28px"  

  [[params.fits]]
    icon = "branch"
    title = "Automated pipelines"
    url = "how-to/run-in-github-actions/"
    desc = "Run checks on every change in GitHub Actions and send the results to the Security tab."

  [[params.fits]]
    icon = "filecode"
    title = "Configuration as code"
    url = "reference/configuration/"
    desc = "Declare what to check, which plugin checks it, and the policy to apply in one file you keep under version control."

  [[params.fits]]
    icon = "shield"
    title = "Compliance evidence"
    url = "reference/output-schema/"
    desc = "Turn written requirements into automated checks, and keep a record of every result."

  [[params.fits]]
    icon = "workflow"
    title = "Security reviews"
    url = "explanation/introduction/"
    desc = "Catch security and compliance gaps while software is being built, not after it ships."

  [[params.fits]]
    icon = "puzzle"
    title = "Open-source plugins"
    url = "reference/plugin-catalog/"
    desc = "Add new checks through plugins built by the community, or write your own."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ["HTML", "JSON"]
