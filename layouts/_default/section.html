{{ define "main" }}
<div class="shell">
  <aside class="sidebar"><div class="sidebar-scroll">{{ partial "sidebar.html" . }}</div></aside>
  <main class="doc-main">
    <article class="doc-column">
      <h1 class="page-title">{{ .Title }}</h1>
      <div class="prose">{{ .Content }}</div>
      <div class="card-grid cols-3">
        {{ range .Pages.ByWeight }}
        <a class="card" href="{{ .RelPermalink }}">
          <h3>{{ .LinkTitle }}</h3>
          <p>{{ .Description }}</p>
          {{ partial "icons/chevron.html" }}
        </a>
        {{ end }}
      </div>
    </article>
  </main>
</div>
{{ end }}
