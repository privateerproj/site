{{ $currentURL := .RelPermalink }}
{{ range (where site.Sections "Type" "docs").ByWeight }}
<div class="nav-group">
  <h4>{{ .LinkTitle }}</h4>
  <ul>
    {{ range .Pages.ByWeight }}
    <li><a href="{{ .RelPermalink }}"{{ if eq .RelPermalink $currentURL }} class="active" aria-current="page"{{ end }}>{{ .LinkTitle }}</a></li>
    {{ end }}
  </ul>
</div>
{{ end }}
