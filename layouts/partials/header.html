{{ $brandSuffix := .Scratch.Get "brandSuffix" | default "docs" }}
{{ $docsActive := or (eq .Type "docs") (eq .Type "library") }}
<header class="site-header">
  <div class="header-inner">
    <button id="menu-btn" class="icon-btn" aria-label="Open navigation" aria-controls="drawer" aria-expanded="false">{{ partial "icons/menu.html" }}</button>
    <a class="brand" href="{{ "/" | relURL }}" aria-label="Privateer {{ $brandSuffix }} home"><img class="logo" src="{{ .Site.Params.brandLogo | relURL }}" alt="" height="26"><span class="brand-name">privateer</span> <span class="docs">/ {{ $brandSuffix }}</span></a>
    <div class="header-search">
      <button class="search-trigger" data-search-open aria-label="Search docs">{{ partial "icons/search.html" }}<span>Search docs&hellip;</span><kbd><span class="search-kbd-mod">Ctrl</span> K</kbd></button>
    </div>
    <nav class="header-tabs">
      <a href="{{ "/" | relURL }}"{{ if .IsHome }} class="active"{{ end }}>Home</a>
      <a href="{{ (site.GetPage "/library").RelPermalink }}"{{ if $docsActive }} class="active"{{ end }}>Docs</a>
    </nav>
    <div class="header-actions">
      <button id="theme-btn" class="icon-btn" aria-label="Toggle theme">{{ partial "icons/sun.html" }}{{ partial "icons/moon.html" }}</button>
      <a class="icon-btn" href="{{ .Site.Params.repoURL }}" target="_blank" rel="noopener" aria-label="GitHub">{{ partial "icons/github.html" }}</a>
    </div>
  </div>
</header>
